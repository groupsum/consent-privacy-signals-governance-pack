body: |-
  ## Context
  
  Global Privacy Control defines a user privacy preference signal communicated by browsers, user agents, or other agents. It can appear through HTTP request signals and browser JavaScript surfaces.
  
  ## Decision
  
  GPC source curation covers user preference signal semantics, transmission surfaces, receipt behavior, and evaluation targets. GPC targets must remain separate from encoded consent strings, Google tag consent-state APIs, legacy DNT handling, and privacy-governance record storage unless explicit downstream mappings are documented.
  
  ## Authority Sources
  
  - Global Privacy Control.
