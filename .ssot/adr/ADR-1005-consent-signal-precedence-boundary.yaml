body: |-
  ## Context
  
  Systems can receive multiple consent and privacy signals for the same request, session, user, device, region, vendor, purpose, or tag behavior. Signals can conflict or apply at different layers.
  
  ## Decision
  
  Consent-signal precedence curation covers target rules for resolving conflicts among GPC, DNT, GPP, TCF, Google Consent Mode, and accountability evidence. Precedence targets must distinguish source receipt from evaluated outcome and must not silently convert one authority family into another.
  
  ## Authority Sources
  
  - Global Privacy Control.
  - W3C Tracking Preference Expression / Do Not Track.
  - IAB Tech Lab Global Privacy Platform.
  - IAB Europe Transparency and Consent Framework.
  - Google Consent Mode.
  - IAB Accountability Platform.
