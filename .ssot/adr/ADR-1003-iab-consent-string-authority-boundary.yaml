body: |-
  ## Context
  
  IAB Global Privacy Platform and IAB Europe Transparency and Consent Framework define encoded consent and privacy strings that carry framework-specific, section-specific, purpose-specific, vendor-specific, and jurisdiction-specific information.
  
  ## Decision
  
  IAB consent-string source curation covers GPP strings, GPP sections, TCF strings, TCF purposes, vendor consent, legitimate interest, special purposes, special features, and applicable framework metadata. IAB string targets must remain separate from GPC preference signals, DNT signals, and Google Consent Mode state unless an explicit translation or precedence target is curated.
  
  ## Authority Sources
  
  - IAB Tech Lab Global Privacy Platform.
  - IAB Europe Transparency and Consent Framework.
