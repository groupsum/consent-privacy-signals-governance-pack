body: |-
  ## Purpose
  
  Define pack-local requirements for curating consent and privacy signal exchange targets from authoritative source families.
  
  ## Requirements
  
  - The curated target set MUST distinguish browser/user-agent preference signals, encoded privacy strings, consent-state APIs, legacy tracking preference signals, precedence rules, jurisdiction applicability, and runtime signal evidence.
  - The curated target set MUST NOT treat privacy governance records, consent receipts, privacy notices, processing records, analytics events, advertising supply-chain records, or customer profile records as signal exchange targets unless a listed source directly governs signal receipt or evaluation.
  - Each target SHOULD identify whether it governs signal receipt, signal decoding, default state, update state, purpose/vendor evaluation, jurisdiction selection, evidence retention, or exportable evaluated state.
  - Each target SHOULD preserve source family and authority source names so downstream adopters can map implementation choices to the correct authority.
  
  ## Authority Sources
  
  - Global Privacy Control.
  - W3C Tracking Preference Expression / Do Not Track.
  - IAB Tech Lab Global Privacy Platform.
  - IAB Europe Transparency and Consent Framework.
  - Google Consent Mode.
  - IAB Accountability Platform.
