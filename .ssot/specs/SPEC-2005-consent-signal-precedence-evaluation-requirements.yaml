body: |-
  ## Purpose
  
  Define pack-local requirements for curating consent signal precedence and evaluation targets.
  
  ## Requirements
  
  - Precedence targets MUST distinguish source signal receipt from evaluated outcome.
  - Precedence targets MUST identify conflict behavior across GPC, DNT, GPP, TCF, Google Consent Mode, and manual consent-state inputs where applicable.
  - Precedence targets SHOULD preserve jurisdiction, purpose, vendor, tag surface, timestamp, and evidence context when those values affect the evaluated outcome.
  - Precedence targets MUST NOT silently convert one authority family into another without a curated translation or mapping target.
  
  ## Authority Sources
  
  - Global Privacy Control.
  - W3C Tracking Preference Expression / Do Not Track.
  - IAB Tech Lab Global Privacy Platform.
  - IAB Europe Transparency and Consent Framework.
  - Google Consent Mode.
  - IAB Accountability Platform.
