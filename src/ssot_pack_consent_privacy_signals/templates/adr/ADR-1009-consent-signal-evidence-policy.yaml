{
  "id": "adr:consent-signal-evidence-policy",
  "number": 1009,
  "slug": "consent-signal-evidence-policy",
  "title": "Consent Signal Evidence Policy",
  "status": "accepted",
  "supersedes": [],
  "superseded_by": [],
  "context": [
    "Consent and privacy signal evaluation often needs evidence showing source signal, receipt time, evaluation time, evaluated outcome, and downstream action.",
    "Evidence for signal exchange is different from durable privacy governance records or consent receipts."
  ],
  "decision": [
    "Retain signal-evaluation evidence sufficient to explain received signals, decoded values, evaluated outcomes, source, timestamp, jurisdiction context, and affected downstream surfaces.",
    "Keep runtime signal evidence separate from long-lived consent receipt or privacy-governance record authority unless explicit downstream mappings are documented."
  ],
  "authority_sources": [
    "IAB Accountability Platform",
    "Global Privacy Control",
    "IAB Tech Lab Global Privacy Platform",
    "IAB Europe Transparency and Consent Framework",
    "Google Consent Mode"
  ],
  "consequences": [
    "Signal handling can be audited without treating signal evidence as a complete consent record.",
    "Evidence tests can verify source, timestamp, decoded value, evaluated outcome, and export behavior."
  ]
}
