  "title": "Consent Precedence Policy",
  "status": "accepted",
  "supersedes": [],
  "superseded_by": [],
  "context": [
    "Multiple consent and privacy signals can apply to the same request, user, browser, region, purpose, vendor, or tag surface.",
    "Signals may conflict or have different legal, technical, or implementation authority."
  ],
  "decision": [
    "Define explicit precedence rules before evaluating conflicting GPC, DNT, GPP, TCF, Consent Mode, or manual consent-state signals.",
    "Preserve both source signals and evaluated outcomes instead of overwriting source evidence."
  ],
  "authority_sources": [
    "Global Privacy Control",
    "W3C Tracking Preference Expression / Do Not Track",
    "IAB Tech Lab Global Privacy Platform",
    "IAB Europe Transparency and Consent Framework",
    "Google Consent Mode",
    "IAB Accountability Platform"
  ],
  "consequences": [
    "Conflicting signal behavior is deterministic and reviewable.",
    "Downstream evidence can explain why a final consent state was selected."
  ]
}
